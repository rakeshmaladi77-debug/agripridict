<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgriPredict – Farmer Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      padding: 2.5rem;
    }
    .auth-card h1 {
      font-size: 1.8rem;
      margin-bottom: .5rem;
      text-align: center;
    }
    .auth-card p {
      color: var(--muted);
      text-align: center;
      margin-bottom: 2rem;
      font-size: .9rem;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      font-size: .85rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: .4rem;
    }
    .form-group input {
      width: 100%;
      padding: .7rem 1rem;
      background: hsla(220,20%,10%,.8);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: inherit;
      transition: border var(--transition);
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .auth-btn {
      width: 100%;
      margin-top: 1rem;
      justify-content: center;
    }
    .auth-footer {
      margin-top: 1.5rem;
      text-align: center;
      font-size: .85rem;
      color: var(--muted);
    }
    .auth-footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .lang-box {
      position: absolute;
      top: 2rem;
      right: 2rem;
    }
  </style>
</head>
<body>
  <div class="lang-box">
    <select onchange="setLanguage(this.value)" class="lang-select">
      <option value="en">🌐 English</option>
      <option value="hi">🇮🇳 हिन्दी</option>
      <option value="te">🇮🇳 తెలుగు</option>
    </select>
  </div>

  <div class="auth-container">
    <div class="glass auth-card">
      <h1 data-t="brand">AgriPredict</h1>
      <p>Log in to manage your crops and orders.</p>
      
      <form id="login-form">
        <div class="form-group">
          <label data-t="contactPhone">Phone Number</label>
          <input type="tel" id="phone" value="9391357351" placeholder="e.g. 9876543210" required />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" value="password123" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-primary auth-btn">🚀 Log In</button>
      </form>
      
      <div style="margin: 1.5rem 0; display: flex; align-items: center; gap: 1rem;">
        <div style="flex: 1; height: 1px; background: var(--border);"></div>
        <span style="font-size: .8rem; color: var(--muted);">OR</span>
        <div style="flex: 1; height: 1px; background: var(--border);"></div>
      </div>

      <a href="/api/auth/google" style="text-decoration: none;">
        <button type="button" class="btn-secondary auth-btn" style="display: flex; align-items: center; gap: .8rem; background: white; color: #1e293b;">
          <img src="https://www.google.com/favicon.ico" width="18" height="18" alt="Google" />
          Continue with Google
        </button>
      </a>
      
      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="lang.js"></script>
  <script src="voice.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('token', data.token);
          window.location.href = 'dashboard.html';
        } else {
          showToast(`❌ ${data.msg || 'Login failed'}`);
        }
      } catch (err) {
        showToast('⚠️ Server connection failed');
      }
    });

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3500);
    }
  </script>
</body>
</html>
